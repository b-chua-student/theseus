[tool.ruff]
src = ["backend"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # import sorting
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplifications
    "A",            # builtin shadowing (your `id` param)
    "T20",          # print statements
    "ANN",          # annotations
    "FBT",          # boolean traps
    "D",            # docstrings
]
ignore = [
    "D100", "D104",  # missing module/package docstrings
    "D203", "D213",  # conflict with D211/D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"backend/domain/**" = ["A002"]

[tool.mypy]
mypy_path = "backend"
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
