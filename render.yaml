# Render Blueprint: one Docker web service that serves both the API and the frontend.
# Create it from the dashboard via New > Blueprint, or let Render pick this file up.
services:
  - type: web
    name: theseus
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Generated once by Render; signs session cookies.
      - key: SECRET_KEY
        generateValue: true
      # Secrets: Render prompts for these on first deploy (they are not stored in git).
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_DB
        value: theseus
      # The site is served over HTTPS, so the session cookie must be Secure.
      - key: SESSION_COOKIE_SECURE
        value: "1"
      # One proxy (Render's load balancer) sits in front of the app; trust its
      # X-Forwarded-For so rate limits apply per user instead of to everyone at once.
      - key: TRUST_PROXY_HOPS
        value: "1"
