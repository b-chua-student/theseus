name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm exec -- svelte-check --tsconfig ./jsconfig.json
      - name: Run frontend unit tests
        run: npm test
      - name: Run frontend component tests
        run: npm run test:components
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend pre-commit hooks
        run: |
          pre-commit run ruff --all-files
          pre-commit run ruff-format --all-files
          pre-commit run mypy --all-files
      - name: Run backend unit tests
        run: python -m pytest -m "not integration"
      - name: Cache MiniLM test snapshot
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--sentence-transformers--all-MiniLM-L6-v2
          key: minilm-onnx-${{ hashFiles('backend/tests/domain/assistant/test_production_rag.py') }}
      - name: Run backend integration tests
        run: python -m pytest -m integration
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - name: Install Chromium for Playwright
        run: npm exec -- playwright install --with-deps --only-shell chromium
        working-directory: e2e
      - name: Run end-to-end tests
        run: npm test
        working-directory: e2e
